<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体 5：极简左侧文本+纯图标选择阵列</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">变体 5：极简左侧文本+纯图标选择阵列</h2>
            </div>

            <div class="space-y-5 py-2">
                <div class="pt-4 border-t border-gray-100">
                    <div class="text-gray-800 text-[14px] mb-4 font-medium flex items-center gap-2">
                        <i data-lucide="edit-3" class="w-4 h-4 text-teal-500"></i> 变量定义
                    </div>
                    <div class="space-y-3 pl-6 border-l-2 border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="w-16 text-[13px] text-gray-500">变量名</span>
                            <input type="text"
                                class="border border-gray-200 rounded px-2 py-1 text-[13px] outline-none focus:border-teal-400 w-48" />
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="w-16 text-[13px] text-gray-500">展示名</span>
                            <input type="text"
                                class="border border-gray-200 rounded px-2 py-1 text-[13px] outline-none focus:border-teal-400 w-48" />
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="w-16 text-[13px] text-gray-500">默认值</span>
                            <input type="text"
                                class="border border-gray-200 rounded px-2 py-1 text-[13px] outline-none focus:border-teal-400 w-48" />
                        </div>
                        <div class="flex items-start gap-3 pt-2">
                            <span class="w-16 text-[13px] text-gray-500 pt-1">数据类型</span>
                            <div class="flex gap-1 bg-gray-50 p-1 rounded-lg border border-gray-200"
                                id="v5-icons-container">
                                <!-- JS Dynamic -->
                            </div>
                            <span id="v5-type-text"
                                class="text-[12px] text-teal-600 pt-1.5 font-medium ml-2">String</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="demo.html" class="text-teal-600 hover:underline text-sm flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回主列表
            </a>
        </div>
    </div>

    <script>
        const varTypes = [
            { id: 'String', icon: 'type' },
            { id: 'Number', icon: 'hash' },
            { id: 'Boolean', icon: 'toggle-left' },
            { id: 'Array', icon: 'brackets' },
            { id: 'Object', icon: 'braces' },
        ];

        const container = document.getElementById('v5-icons-container');
        container.innerHTML = varTypes.map(t => `<button data-type="${t.id}" title="${t.id}" class="v5-type-btn p-1.5 rounded transition-colors ${t.id === 'String' ? 'bg-teal-500 text-white shadow-sm' : 'text-gray-400 hover:bg-gray-200 hover:text-gray-700'}"><i data-lucide="${t.icon}" class="w-4 h-4"></i></button>`).join('');

        document.querySelectorAll('.v5-type-btn').forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v5-type-text').innerText = type;
            document.querySelectorAll('.v5-type-btn').forEach(b => {
                b.className = `v5-type-btn p-1.5 rounded transition-colors ${b.dataset.type === type ? 'bg-teal-500 text-white shadow-sm' : 'text-gray-400 hover:bg-gray-200 hover:text-gray-700'}`;
            });
        }));
        lucide.createIcons();
    </script>
</body>

</html>
