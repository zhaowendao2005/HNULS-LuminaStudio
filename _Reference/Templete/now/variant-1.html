<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体 1：标准网格+平铺胶囊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">变体 1：标准网格+平铺胶囊</h2>
            </div>

            <!-- Context Header -->
            <div class="space-y-6 mb-6">
                <div class="border-b border-gray-100 pb-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-gray-800 font-[500] text-[15px]">输入数组 <span class="text-red-500 ml-0.5">*</span>
                        </h3>
                        <span
                            class="px-2.5 py-0.5 rounded-full border border-cyan-200 text-cyan-600 bg-cyan-50/50 text-[11px] font-medium tracking-wide">ARRAY</span>
                    </div>
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                        <span class="text-teal-600 font-medium text-[14px]">输入变量</span>
                        <span class="text-gray-400 text-[14px]">点击选择数组变量</span>
                    </div>
                </div>
                <div class="border-b border-gray-100 pb-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-gray-800 font-[500] text-[15px]">结果项变量 <span
                                class="text-red-500 ml-0.5">*</span></h3>
                        <span
                            class="px-2.5 py-0.5 rounded-full border border-cyan-200 text-cyan-600 bg-cyan-50/50 text-[11px] font-medium tracking-wide">INTERNAL</span>
                    </div>
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity mb-2">
                        <span class="text-teal-600 font-medium text-[14px]">输出变量</span>
                        <span class="text-gray-400 text-[14px]">点击选择内部输出变量</span>
                    </div>
                    <p class="text-gray-400 text-[13px] leading-relaxed">存在条件分支时，需要为每条支路分别配置导出变量；运行时会按当前 item 实际命中的支路取值。
                    </p>
                </div>
            </div>

            <!-- Variant Content -->
            <div class="space-y-4">
                <div class="flex justify-between items-center py-2 border-b border-gray-50">
                    <span class="text-gray-800 text-[15px]">并行执行</span>
                    <button id="v1-parallel-btn" class="w-10 h-5.5 rounded-full relative transition-colors bg-gray-200">
                        <div id="v1-parallel-thumb"
                            class="w-4.5 h-4.5 bg-white rounded-full absolute top-0.5 transition-transform translate-x-0.5">
                        </div>
                    </button>
                </div>
                <div class="pt-4 border-t border-gray-100">
                    <div class="flex items-center gap-2 mb-4">
                        <h3 class="text-teal-700 font-[500] text-[15px]">声明新变量</h3>
                        <div class="h-px bg-gray-100 flex-1"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[13px] text-gray-500 mb-1.5">变量名 (Key)</label>
                                <input type="text" placeholder="如 user_id"
                                    class="w-full bg-gray-50 border border-transparent focus:bg-white focus:border-teal-400 outline-none rounded-lg px-3 py-2 text-[14px] transition-all" />
                            </div>
                            <div>
                                <label class="block text-[13px] text-gray-500 mb-1.5">展示名称 (Label)</label>
                                <input type="text" placeholder="如 用户ID"
                                    class="w-full bg-gray-50 border border-transparent focus:bg-white focus:border-teal-400 outline-none rounded-lg px-3 py-2 text-[14px] transition-all" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] text-gray-500 mb-1.5">变量类型</label>
                            <div class="flex flex-wrap gap-2" id="v1-types-container">
                                <!-- JS Dynamic -->
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] text-gray-500 mb-1.5">默认值</label>
                            <input type="text" placeholder="输入默认值..."
                                class="w-full bg-gray-50 border border-transparent focus:bg-white focus:border-teal-400 outline-none rounded-lg px-3 py-2 text-[14px] transition-all" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="demo.html" class="text-teal-600 hover:underline text-sm flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回主列表
            </a>
        </div>
    </div>

    <script>
        const varTypes = [
            { id: 'String', icon: 'type', desc: '文本字符串' },
            { id: 'Number', icon: 'hash', desc: '数字类型' },
            { id: 'Boolean', icon: 'toggle-left', desc: '真假值' },
            { id: 'Array', icon: 'brackets', desc: '列表数组' },
            { id: 'Object', icon: 'braces', desc: '键值对对象' },
        ];

        // Render Types
        const container = document.getElementById('v1-types-container');
        container.innerHTML = varTypes.map(t => `<div data-type="${t.id}" class="v1-type-btn px-3 py-1.5 rounded-md cursor-pointer border text-[13px] transition-colors ${t.id === 'String' ? 'bg-cyan-50 border-cyan-200 text-teal-600 font-medium' : 'bg-white border-gray-200 text-gray-600 hover:border-teal-300'}">${t.id}</div>`).join('');

        // V1 Logic
        let v1Parallel = false;
        const v1Btn = document.getElementById('v1-parallel-btn');
        const v1Thumb = document.getElementById('v1-parallel-thumb');
        v1Btn.addEventListener('click', () => {
            v1Parallel = !v1Parallel;
            v1Btn.className = `w-10 h-5.5 rounded-full relative transition-colors ${v1Parallel ? 'bg-teal-500' : 'bg-gray-200'}`;
            v1Thumb.className = `w-4.5 h-4.5 bg-white rounded-full absolute top-0.5 transition-transform ${v1Parallel ? 'translate-x-[18px]' : 'translate-x-0.5'}`;
        });

        const v1Buttons = document.querySelectorAll('.v1-type-btn');
        v1Buttons.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            v1Buttons.forEach(b => {
                b.className = `v1-type-btn px-3 py-1.5 rounded-md cursor-pointer border text-[13px] transition-colors ${b.dataset.type === type ? 'bg-cyan-50 border-cyan-200 text-teal-600 font-medium' : 'bg-white border-gray-200 text-gray-600 hover:border-teal-300'}`;
            });
        }));

        lucide.createIcons();
    </script>
</body>

</html>
