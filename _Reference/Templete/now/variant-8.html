<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体 8：微型卡片网格+横向滑动选择器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">变体 8：微型卡片网格+横向滑动选择器</h2>
            </div>

            <div class="space-y-4 pt-2">
                <div class="text-[14px] font-medium text-gray-700 mb-3 px-1">配置输出变量</div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div
                        class="border border-gray-200 rounded-lg p-2 bg-gray-50 focus-within:border-teal-400 focus-within:bg-white transition-colors">
                        <div class="text-[11px] text-gray-400 mb-1">变量名</div>
                        <input type="text"
                            class="w-full bg-transparent outline-none text-[13px] font-medium text-gray-800" />
                    </div>
                    <div
                        class="border border-gray-200 rounded-lg p-2 bg-gray-50 focus-within:border-teal-400 focus-within:bg-white transition-colors">
                        <div class="text-[11px] text-gray-400 mb-1">展示名称</div>
                        <input type="text" class="w-full bg-transparent outline-none text-[13px] text-gray-800" />
                    </div>
                </div>
                <div class="border border-gray-200 rounded-lg p-3">
                    <div class="text-[11px] text-gray-400 mb-2">选择数据类型</div>
                    <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar" id="v8-slider">
                        <!-- JS Dynamic -->
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="demo.html" class="text-teal-600 hover:underline text-sm flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回主列表
            </a>
        </div>
    </div>

    <script>
        const varTypes = ['String', 'Number', 'Boolean', 'Array', 'Object'];
        const slider = document.getElementById('v8-slider');
        slider.innerHTML = varTypes.map(t => `
            <div data-type="${t}" class="v8-type-btn shrink-0 border rounded-md px-3 py-2 text-center cursor-pointer transition-colors ${t === 'String' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-gray-100 bg-gray-50 text-gray-500 hover:border-teal-200'}">
                <div class="text-[12px] font-medium">${t}</div>
            </div>
        `).join('');

        document.querySelectorAll('.v8-type-btn').forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.querySelectorAll('.v8-type-btn').forEach(b => {
                b.className = `v8-type-btn shrink-0 border rounded-md px-3 py-2 text-center cursor-pointer transition-colors ${b.dataset.type === type ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-gray-100 bg-gray-50 text-gray-500 hover:border-teal-200'}`;
            });
        }));
        lucide.createIcons();
    </script>
</body>

</html>
