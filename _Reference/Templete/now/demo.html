                                    <button id="v9-toggle" class="flex items-center gap-1 text-[12px] bg-teal-50 text-teal-600 px-2 py-1 rounded-full border border-teal-100 hover:bg-teal-100">
                                        类型: <span id="v9-type-text" class="font-bold">String</span>
                                    </button>
                                </div>
                                <div class="space-y-3">
                                    <input type="text" placeholder="变量名 (如 age)" class="w-full border-b border-gray-200 py-2 outline-none focus:border-teal-400 text-[14px]" />
                                    <input type="text" placeholder="展示名称 (如 年龄)" class="w-full border-b border-gray-200 py-2 outline-none focus:border-teal-400 text-[14px]" />
                                    <input type="text" placeholder="设置默认值" class="w-full border-b border-gray-200 py-2 outline-none focus:border-teal-400 text-[14px]" />
                                </div>
                            </div>
                            <div id="v9-view-2" class="space-y-2 duration-200 bg-gray-50 p-4 rounded-xl" style="display: none;">
                                <div class="flex justify-between items-center mb-2">
                                    <div class="text-gray-800 text-[14px] font-medium">请选择期望的类型</div>
                                    <button id="v9-back" class="text-gray-400 hover:text-gray-600">返回</button>
                                </div>
                                ${varTypes.map(t => `
                                    <div data-type="${t.id}" class="v9-type-btn p-3 rounded-lg bg-white border cursor-pointer flex justify-between items-center ${t.id === 'String' ? 'border-teal-500 shadow-sm' : 'border-transparent hover:border-gray-200'}">
                                        <span class="v9-text text-[14px] ${t.id === 'String' ? 'text-teal-600 font-medium' : 'text-gray-700'}">${t.id}</span>
                                        <i data-lucide="check-circle-2" class="v9-check w-4 h-4 text-teal-500" style="display: ${t.id === 'String' ? 'block' : 'none'};"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 10,
                title: "变体 10：自然语言完形填空 (最沉浸文本交互)",
                content: `
                    <div class="space-y-4 pt-1">
                        <div class="pt-4 border-t border-gray-100">
                            <div class="text-gray-800 text-[14px] mb-3">变量声明语句</div>
                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-100 leading-loose text-[14px] text-gray-700 font-serif">
                                我需要声明一个类型为 
                                <span id="v10-type-btn" class="inline-block mx-2 font-sans font-medium text-teal-600 bg-teal-50 border-b-2 border-teal-200 px-2 py-0.5 rounded cursor-pointer hover:bg-teal-100 transition-colors">
                                    <span id="v10-type-text">String</span>
                                </span> 
                                的变量，
                                它的键名为 
                                <input type="text" placeholder="输入key" class="inline-block w-24 mx-2 font-sans bg-transparent border-b border-gray-300 outline-none focus:border-teal-500 text-center text-teal-700 placeholder-gray-300 transition-colors" />，
                                前端展示名称叫做
                                <input type="text" placeholder="输入名称" class="inline-block w-24 mx-2 font-sans bg-transparent border-b border-gray-300 outline-none focus:border-teal-500 text-center text-teal-700 placeholder-gray-300 transition-colors" />，
                                并且将其默认值初始化为
                                <input type="text" placeholder="空" class="inline-block w-16 mx-2 font-sans bg-transparent border-b border-gray-300 outline-none focus:border-teal-500 text-center text-teal-700 placeholder-gray-300 transition-colors" />。
                            </div>
                            <div class="text-[12px] text-gray-400 mt-2 ml-1">* 点击高亮的类型文字即可快速切换类型。</div>
                        </div>
                    </div>
                `
            }
        ];

        // 渲染主结构
        const container = document.getElementById('variations-container');
        container.innerHTML = variations.map(v => `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow flex flex-col">
                <div class="mb-4 pb-3 border-b border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800">${v.title}</h2>
                </div>
                <div class="flex-1 bg-white">
                    ${ContextHeader}
                    ${v.content}
                </div>
            </div>
        `).join('');

        // --- 绑定交互逻辑 ---

        // V1 逻辑
        let v1Parallel = false;
        const v1Btn = document.getElementById('v1-parallel-btn');
        const v1Thumb = document.getElementById('v1-parallel-thumb');
        v1Btn.addEventListener('click', () => {
            v1Parallel = !v1Parallel;
            v1Btn.className = `w-10 h-5.5 rounded-full relative transition-colors ${v1Parallel ? 'bg-teal-500' : 'bg-gray-200'}`;
            v1Thumb.className = `w-4.5 h-4.5 bg-white rounded-full absolute top-0.5 transition-transform ${v1Parallel ? 'translate-x-[18px]' : 'translate-x-0.5'}`;
        });
        const v1Types = document.querySelectorAll('.v1-type-btn');
        v1Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            v1Types.forEach(b => {
                b.className = `v1-type-btn px-3 py-1.5 rounded-md cursor-pointer border text-[13px] transition-colors ${b.dataset.type === type ? 'bg-cyan-50 border-cyan-200 text-teal-600 font-medium' : 'bg-white border-gray-200 text-gray-600 hover:border-teal-300'}`;
            });
        }));

        // V2 逻辑
        let v2Type = 'String';
        document.getElementById('v2-type-btn').addEventListener('click', () => {
            const idx = varTypes.findIndex(t => t.id === v2Type);
            v2Type = varTypes[(idx + 1) % varTypes.length].id;
            document.getElementById('v2-type-text').innerText = v2Type;
        });

        // V3 逻辑
        let v3Show = false;
        const v3Menu = document.getElementById('v3-menu');
        document.getElementById('v3-toggle').addEventListener('click', () => {
            v3Show = !v3Show;
            v3Menu.style.display = v3Show ? 'flex' : 'none';
        });
        const v3Types = document.querySelectorAll('.v3-type-btn');
        v3Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v3-type-text').innerText = type;
            v3Show = false;
            v3Menu.style.display = 'none';
            v3Types.forEach(b => {
                b.className = `v3-type-btn shrink-0 px-3 py-1.5 rounded-md text-[13px] ${b.dataset.type === type ? 'bg-teal-500 text-white' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}`;
            });
        }));

        // V4 逻辑
        let v4Type = 'String';
        const v4Input = document.getElementById('v4-search');
        const v4List = document.getElementById('v4-list');
        const renderV4List = (filterStr) => {
            const filtered = varTypes.filter(t => t.id.toLowerCase().includes(filterStr.toLowerCase()));
            v4List.innerHTML = filtered.map(t => `<span data-type="${t.id}" class="v4-type-btn text-[12px] text-teal-600 bg-teal-50 px-2 py-0.5 rounded cursor-pointer hover:bg-teal-100">${t.id}</span>`).join('');
            v4List.querySelectorAll('.v4-type-btn').forEach(btn => btn.addEventListener('click', e => {
                v4Type = e.currentTarget.dataset.type;
                v4Input.value = '';
                v4Input.placeholder = `当前: ${v4Type}`;
                renderV4List('');
            }));
        };
        v4Input.addEventListener('input', e => renderV4List(e.target.value));
        renderV4List('');

        // V5 逻辑
        const v5Types = document.querySelectorAll('.v5-type-btn');
        v5Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v5-type-text').innerText = type;
            v5Types.forEach(b => {
                b.className = `v5-type-btn p-1.5 rounded transition-colors ${b.dataset.type === type ? 'bg-teal-500 text-white shadow-sm' : 'text-gray-400 hover:bg-gray-200 hover:text-gray-700'}`;
            });
        }));

        // V6 逻辑
        const v6Types = document.querySelectorAll('.v6-type-btn');
        v6Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            v6Types.forEach(b => {
                const isSelected = b.dataset.type === type;
                b.className = `v6-type-btn flex items-start gap-3 p-3 rounded-lg cursor-pointer border transition-colors ${isSelected ? 'bg-white border-teal-300 shadow-sm' : 'border-transparent hover:bg-gray-100'}`;
                b.querySelector('.v6-circle').className = `v6-circle mt-0.5 w-4 h-4 rounded-full border flex justify-center items-center ${isSelected ? 'border-teal-500' : 'border-gray-300'}`;
                b.querySelector('.v6-circle').innerHTML = isSelected ? '<div class="w-2 h-2 rounded-full bg-teal-500"></div>' : '';
                b.querySelector('.v6-text').className = `v6-text text-[14px] font-medium ${isSelected ? 'text-teal-700' : 'text-gray-700'}`;
            });
        }));

        // V7 逻辑
        const v7Drawer = document.getElementById('v7-drawer');
        document.getElementById('v7-toggle').addEventListener('click', () => { v7Drawer.style.transform = 'translateX(0)'; });
        document.getElementById('v7-close').addEventListener('click', () => { v7Drawer.style.transform = 'translateX(100%)'; });
        const v7Types = document.querySelectorAll('.v7-type-btn');
        v7Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v7-type-text').innerText = type;
            v7Drawer.style.transform = 'translateX(100%)';
            v7Types.forEach(b => {
                b.querySelector('.v7-check').style.display = b.dataset.type === type ? 'block' : 'none';
            });
        }));

        // V8 逻辑
        const v8Types = document.querySelectorAll('.v8-type-btn');
        v8Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            v8Types.forEach(b => {
                b.className = `v8-type-btn shrink-0 border rounded-md px-3 py-2 text-center cursor-pointer transition-colors ${b.dataset.type === type ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-gray-100 bg-gray-50 text-gray-500 hover:border-teal-200'}`;
            });
        }));

        // V9 逻辑
        const v9View1 = document.getElementById('v9-view-1');
        const v9View2 = document.getElementById('v9-view-2');
        document.getElementById('v9-toggle').addEventListener('click', () => { v9View1.style.display = 'none'; v9View2.style.display = 'block'; });
        document.getElementById('v9-back').addEventListener('click', () => { v9View1.style.display = 'block'; v9View2.style.display = 'none'; });
        const v9Types = document.querySelectorAll('.v9-type-btn');
        v9Types.forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v9-type-text').innerText = type;
            v9View1.style.display = 'block';
            v9View2.style.display = 'none';
            v9Types.forEach(b => {
                const isSelected = b.dataset.type === type;
                b.className = `v9-type-btn p-3 rounded-lg bg-white border cursor-pointer flex justify-between items-center ${isSelected ? 'border-teal-500 shadow-sm' : 'border-transparent hover:border-gray-200'}`;
                b.querySelector('.v9-text').className = `v9-text text-[14px] ${isSelected ? 'text-teal-600 font-medium' : 'text-gray-700'}`;
                b.querySelector('.v9-check').style.display = isSelected ? 'block' : 'none';
            });
        }));

        // V10 逻辑
        let v10Type = 'String';
        document.getElementById('v10-type-btn').addEventListener('click', () => {
            const idx = varTypes.findIndex(t => t.id === v10Type);
            v10Type = varTypes[(idx + 1) % varTypes.length].id;
            document.getElementById('v10-type-text').innerText = v10Type;
        });

        // 初始化渲染 Lucide 图标
        lucide.createIcons();
    </script>
</body>

</html>
