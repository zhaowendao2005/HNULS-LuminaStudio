<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体 2：内联无框+纯文本循环切换</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">变体 2：内联无框+纯文本循环切换</h2>
            </div>

            <!-- Context Header -->
            <div class="space-y-6 mb-6">
                <!-- ... header content ... -->
                <div class="border-b border-gray-100 pb-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-gray-800 font-[500] text-[15px]">输入数组 <span class="text-red-500 ml-0.5">*</span>
                        </h3>
                        <span
                            class="px-2.5 py-0.5 rounded-full border border-cyan-200 text-cyan-600 bg-cyan-50/50 text-[11px] font-medium tracking-wide">ARRAY</span>
                    </div>
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                        <span class="text-teal-600 font-medium text-[14px]">输入变量</span>
                        <span class="text-gray-400 text-[14px]">点击选择数组变量</span>
                    </div>
                </div>
                <div class="border-b border-gray-100 pb-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-gray-800 font-[500] text-[15px]">结果项变量 <span
                                class="text-red-500 ml-0.5">*</span></h3>
                        <span
                            class="px-2.5 py-0.5 rounded-full border border-cyan-200 text-cyan-600 bg-cyan-50/50 text-[11px] font-medium tracking-wide">INTERNAL</span>
                    </div>
                    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity mb-2">
                        <span class="text-teal-600 font-medium text-[14px]">输出变量</span>
                        <span class="text-gray-400 text-[14px]">点击选择内部输出变量</span>
                    </div>
                </div>
            </div>

            <div class="space-y-5 pt-2">
                <div class="flex items-center gap-2 cursor-pointer">
                    <span class="text-teal-600 font-medium text-[14px]">并行执行：已关闭</span>
                </div>
                <div class="pt-4 border-t border-gray-100 space-y-3">
                    <h3 class="text-gray-800 font-[500] text-[15px] mb-3">声明变量</h3>
                    <div class="flex items-center gap-2 group cursor-text">
                        <span class="text-gray-800 text-[14px] w-20">变量名</span>
                        <input type="text" placeholder="点击输入键名"
                            class="bg-transparent border-b border-transparent group-hover:border-gray-300 focus:border-teal-500 outline-none text-[14px] text-teal-600 placeholder-gray-400 py-0.5 transition-colors w-48" />
                    </div>
                    <div class="flex items-center gap-2 group cursor-text">
                        <span class="text-gray-800 text-[14px] w-20">展示名称</span>
                        <input type="text" placeholder="点击输入展示名"
                            class="bg-transparent border-b border-transparent group-hover:border-gray-300 focus:border-teal-500 outline-none text-[14px] text-teal-600 placeholder-gray-400 py-0.5 transition-colors w-48" />
                    </div>
                    <div class="flex items-center gap-2 group cursor-text">
                        <span class="text-gray-800 text-[14px] w-20">默认值</span>
                        <input type="text" placeholder="为空则无默认值"
                            class="bg-transparent border-b border-transparent group-hover:border-gray-300 focus:border-teal-500 outline-none text-[14px] text-teal-600 placeholder-gray-400 py-0.5 transition-colors w-48" />
                    </div>
                    <div class="flex items-center gap-2 cursor-pointer pt-1" id="v2-type-btn">
                        <span class="text-gray-800 text-[14px] w-20">变量类型</span>
                        <span
                            class="text-teal-600 font-medium text-[14px] border-b border-dashed border-teal-300 pb-0.5"
                            id="v2-type-text">String</span>
                        <span class="text-gray-400 text-[12px] ml-2">(点击文字切换)</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="demo.html" class="text-teal-600 hover:underline text-sm flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回主列表
            </a>
        </div>
    </div>

    <script>
        const varTypes = ['String', 'Number', 'Boolean', 'Array', 'Object'];
        let v2Type = 'String';
        document.getElementById('v2-type-btn').addEventListener('click', () => {
            const idx = varTypes.indexOf(v2Type);
            v2Type = varTypes[(idx + 1) % varTypes.length];
            document.getElementById('v2-type-text').innerText = v2Type;
        });
        lucide.createIcons();
    </script>
</body>

</html>
