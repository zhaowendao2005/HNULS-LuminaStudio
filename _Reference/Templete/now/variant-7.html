<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体 7：左对齐紧凑+右侧模拟侧滑抽屉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .drawer-transition {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-100 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden h-[400px]">
            <div class="mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">变体 7：左对齐紧凑+右侧模拟侧滑抽屉</h2>
            </div>

            <div class="space-y-4 pt-2">
                <div class="text-gray-800 text-[15px] font-medium mb-3">变量</div>
                <div class="space-y-2">
                    <div class="flex items-center gap-3">
                        <span class="text-gray-500 text-[13px] w-16 text-right">标识</span>
                        <input type="text"
                            class="flex-1 border-b border-gray-200 text-[14px] py-1 outline-none focus:border-teal-400 bg-transparent" />
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-gray-500 text-[13px] w-16 text-right">名称</span>
                        <input type="text"
                            class="flex-1 border-b border-gray-200 text-[14px] py-1 outline-none focus:border-teal-400 bg-transparent" />
                    </div>
                    <div class="flex items-center gap-3 pt-1">
                        <span class="text-gray-500 text-[13px] w-16 text-right">类型</span>
                        <div id="v7-toggle"
                            class="flex-1 flex justify-between items-center border border-gray-200 rounded px-2 py-1 cursor-pointer hover:border-teal-300 bg-white">
                            <span id="v7-type-text" class="text-[13px] text-gray-800">String</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <div id="v7-drawer"
                    class="drawer-transition absolute top-0 right-0 w-2/3 h-full bg-white border-l border-gray-200 shadow-[-4px_0_15px_rgba(0,0,0,0.05)] z-10 flex flex-col translate-x-full">
                    <div class="flex justify-between items-center p-3 border-b border-gray-100 bg-gray-50">
                        <span class="text-[14px] font-medium text-gray-700">选择类型</span>
                        <i id="v7-close" data-lucide="x" class="w-4 h-4 text-gray-400 cursor-pointer"></i>
                    </div>
                    <div class="p-2 space-y-1 overflow-y-auto" id="v7-list">
                        <!-- JS Dynamic -->
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-center">
            <a href="demo.html" class="text-teal-600 hover:underline text-sm flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回主列表
            </a>
        </div>
    </div>

    <script>
        const varTypes = ['String', 'Number', 'Boolean', 'Array', 'Object'];
        const v7Drawer = document.getElementById('v7-drawer');
        const v7List = document.getElementById('v7-list');

        v7List.innerHTML = varTypes.map(t => `
            <div data-type="${t}" class="v7-type-btn px-3 py-2 rounded hover:bg-teal-50 cursor-pointer text-[13px] text-gray-700 flex justify-between">
                <span>${t}</span>
                <i data-lucide="check" class="v7-check w-4 h-4 text-teal-500" style="display: ${t === 'String' ? 'block' : 'none'};"></i>
            </div>
        `).join('');

        document.getElementById('v7-toggle').addEventListener('click', () => { v7Drawer.style.transform = 'translateX(0)'; });
        document.getElementById('v7-close').addEventListener('click', () => { v7Drawer.style.transform = 'translateX(100%)'; });

        document.querySelectorAll('.v7-type-btn').forEach(btn => btn.addEventListener('click', e => {
            const type = e.currentTarget.dataset.type;
            document.getElementById('v7-type-text').innerText = type;
            v7Drawer.style.transform = 'translateX(100%)';
            document.querySelectorAll('.v7-type-btn').forEach(b => {
                b.querySelector('.v7-check').style.display = b.dataset.type === type ? 'block' : 'none';
            });
        }));
        lucide.createIcons();
    </script>
</body>

</html>
